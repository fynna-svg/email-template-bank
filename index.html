<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Template Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — template list | editor | live email preview; stacks to one column under 1180px */
:root{
  --bg:#EDF1F6; --panel:#FFFFFF; --ink:#13202E; --muted:#5A6879; --line:#D6DFE9;
  --accent:#0B2E59; --accent-ink:#FFFFFF; --soft:#E2EBF5; --field:#F7F9FC;
  --ok:#1D7348; --warn:#9A5600; --bad:#B42318; --stage:#DCE5EF;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --panel:#151D27; --ink:#E4EBF3; --muted:#93A1B2; --line:#27333F;
  --accent:#8FB6E8; --accent-ink:#0A1624; --soft:#1C2836; --field:#101820;
  --ok:#5CC48F; --warn:#E3A048; --bad:#F07A6E; --stage:#0A1016; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --panel:#151D27; --ink:#E4EBF3; --muted:#93A1B2; --line:#27333F;
  --accent:#8FB6E8; --accent-ink:#0A1624; --soft:#1C2836; --field:#101820;
  --ok:#5CC48F; --warn:#E3A048; --bad:#F07A6E; --stage:#0A1016; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.pill-sel{display:flex;align-items:center;gap:8px}
select,input[type=text],input[type=url],input[type=date],input[type=tel],textarea{
  background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ai{border-style:dashed}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:270px minmax(340px,440px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{max-height:calc(100vh - 150px);overflow:auto;padding:6px}
@media (max-width:1180px){.list{max-height:300px}}
.wk{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 8px 4px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 9px}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
.item .t{font-weight:500;display:block}
.item .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.lay{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--ink)}
.st-Draft{color:var(--muted)} .st-Ready{color:var(--ok)} .st-Scheduled{color:var(--accent)} .st-Sent{color:var(--ink)} .st-Archived{color:var(--muted);opacity:.6}
.filters{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.form{padding:12px;display:grid;gap:12px}
.f label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:500;margin-bottom:4px}
.f .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.f .cnt.over{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:6px;border-top:1px solid var(--line)}
.stats,.rows{display:grid;gap:6px}
.statrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.laycard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:var(--field)}
.imgslot,.acct{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.imgslot .h,.acct .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.imgslot .thumb{display:flex;gap:10px;align-items:center}
.imgslot img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.accts label,.toggles label{display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:13px}
.link-out{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 12px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.ver{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pv-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.subj{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px;font-size:13px}
.subj div{display:flex;gap:8px;align-items:baseline;min-width:0}
.subj b{flex:0 0 64px;font-weight:500;color:var(--muted)}
.subj span{min-width:0;overflow-wrap:anywhere;flex:1}
.stage{background:var(--stage);padding:16px;overflow-x:auto;border-radius:0 0 12px 12px}
.stage iframe{display:block;margin:0 auto;border:0;background:#EDF3FA;width:600px;max-width:none;height:900px;border-radius:4px}
.meter{display:grid;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.issues{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;display:grid;gap:3px}
.issues .w{color:var(--warn)} .issues .ok{color:var(--ok)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;z-index:20;max-width:calc(100vw - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,12,20,.45)}
dialog .form{max-height:70vh;overflow:auto}
.codebox{font:12px/1.4 var(--mono);height:50vh;white-space:pre;background:var(--field)}
.banner{margin:8px 12px 0;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[dir=rtl].f input,[dir=rtl].f textarea,.rtl{direction:rtl;font-family:Tahoma,var(--font)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="backend.js"></script>
</head>
<body>


<div class="top">
  <h1>Email Template Bank</h1>
  <div class="pill-sel"><label for="projSel" class="muted">Project</label><select id="projSel" style="width:auto"></select></div>
  <button class="btn small" id="projBtn" type="button">Project settings</button>
  <button class="btn small" id="acctBtn" type="button">Sending accounts</button>
  <span style="flex:1"></span>
  <span id="conn" class="muted" style="font-size:12.5px">Connecting…</span>
</div>

<div class="grid">
  <section class="panel" aria-label="Templates">
    <div class="panel-h"><h2>Templates</h2><span style="flex:1"></span><span id="count" class="muted mono" style="font-size:12px"></span></div>
    <div class="filters">
      <input type="text" id="search" placeholder="Search angle or headline" aria-label="Search">
      <select id="statusFilter" aria-label="Status filter" style="width:118px">
        <option value="active">All active</option><option>Draft</option><option>Ready</option><option>Scheduled</option><option>Sent</option><option>Archived</option>
      </select>
    </div>
    <div class="list" id="list"><div class="empty">Loading templates…</div></div>
  </section>

  <section class="panel" aria-label="Editor" id="editor">
    <div class="empty">Pick a template on the left to edit it.</div>
  </section>

  <section class="panel" aria-label="Preview" id="previewPanel">
    <div class="pv-tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      </div>
      <select id="acctSel" aria-label="Sending account" style="width:auto"></select>
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" data-w="600" aria-pressed="true">Desktop</button><button type="button" data-w="375" aria-pressed="false">Phone</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn small" type="button" id="codeBtn">View HTML</button>
      <button class="btn small" type="button" id="copyBtn">Copy HTML</button>
      <button class="btn small primary" type="button" id="dlBtn">Download .html</button>
    </div>
    <div class="subj" id="subj"></div>
    <div class="meter" id="meter"></div>
    <div class="issues" id="issues"></div>
    <div class="stage"><iframe id="pv" title="Email preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>
  </section>
</div>

<dialog id="acctDlg"><div class="panel-h"><h2>Sending accounts</h2></div><form class="form" id="acctForm" method="dialog"></form>
  <div class="savebar"><span style="flex:1" class="muted">Applies to every project.</span><button class="btn" type="button" id="acctCancel">Cancel</button><button class="btn primary" type="button" id="acctSave">Save accounts</button></div></dialog>
<dialog id="projDlg"><div class="panel-h"><h2>Project settings</h2></div><form class="form" id="projForm" method="dialog"></form>
  <div class="savebar"><span style="flex:1" class="muted">Applies to every template in this project.</span><button class="btn" type="button" id="projCancel">Cancel</button><button class="btn primary" type="button" id="projSave">Save settings</button></div></dialog>
<dialog id="codeDlg"><div class="panel-h"><h2>Email HTML</h2><span style="flex:1"></span><span class="muted mono" id="codeSize" style="font-size:12px"></span></div>
  <div class="form"><textarea id="codeBox" class="codebox" readonly aria-label="Email HTML"></textarea></div>
  <div class="savebar"><span style="flex:1" class="muted">Select all and copy if the Copy button is blocked.</span><button class="btn" type="button" id="codeClose">Close</button></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
// BUILDER-START
const ACCOUNTS = {
  MC:  {platform:'Mailchimp',  source:'MC-emiratesrealtygroup',  domain:'emiratesrealtygroup.com'},
  GR:  {platform:'GetResponse',source:'GR-dubaimainland',        domain:'projects.dubaimainland.community'},
  ML:  {platform:'MailerLite', source:'ML-dxbdreamhome',          domain:'projects.dxbdreamhome.com'},
  ML1: {platform:'MailerLite', source:'ML-dubaiexclusiveestates', domain:'projects.dubaiexclusiveestates.com'},
  GR1: {platform:'GetResponse',source:'GR-eliteresidences',       domain:'projects.eliteresidencesdubai.com'},
  GR2: {platform:'GetResponse',source:'GR-dubaipremiumedge',      domain:'projects.dubaipremiumedge.com'},
  MC1: {platform:'Mailchimp',  source:'MC-springluxe',            domain:'projects.springluxefrontier.com'}
};
const IMG_SPECS = [
  {name:'Hero', size:'1200 × 800 px', w:600, ratio:2/3},
  {name:'Pair, left (1:1)', size:'800 × 800 px', w:280, ratio:1},
  {name:'Pair, right (1:1)', size:'800 × 800 px', w:280, ratio:1},
  {name:'Wide', size:'1200 × 600 px', w:600, ratio:1/2}
];
const LAYOUTS = {
  classic:  {short:'Classic', name:'Classic long-form', imgs:[0,1,2,3],
    hint:'Your proven layout: hero, headline, paragraph, two selling points, stat row, image pair, paragraph, wide image, amenities, two more selling points, ending headline, buttons.',
    fields:['headline','sub','p1','sp01','stats','p2','p3','sp23','closing']},
  short:    {short:'Short', name:'Short', imgs:[0],
    hint:'Hero, eyebrow, headline, stat row, one paragraph, button. Reads in about 10 seconds.',
    fields:['eyebrow','headline','sub','stats','p1']},
  offer:    {short:'Offer', name:'Offer-first', imgs:[0],
    hint:'Opens with the offer in a dark band, then the image, the terms as a stat row and one paragraph.',
    fields:['offerLabel','offer','offerNote','headline','sub','stats','p1']},
  brief:    {short:'Brief', name:'Private investment brief', imgs:[0],
    hint:'A text-led investor note: key figures table, three reasons, one image. Feels like a private memo, not an ad.',
    fields:['eyebrow','headline','sub','stats','p1','bulletsTitle','bullets']},
  editorial:{short:'Editorial', name:'Editorial (brochure sections)', imgs:[0],
    hint:'Brochure style: full-width images, white section cards on a light background, small spaced labels, uppercase headings and square buttons. The intro sits on top; build every section below from blocks (image, small label, heading, paragraph, price rows, payment plan, lists, box pairs, buttons) and use Section break to start a new card.',
    fields:['eyebrow','headline','sub','p1','highlight']},
  curiosity:{short:'Curiosity', name:'Curiosity launch', imgs:[0],
    hint:'A question headline, two lines of copy, and a list of what is only shared on request. The least information, the most reasons to ask.',
    fields:['eyebrow','headline','p1','bulletsTitle','bullets']}
};
const LAYOUT_SECTIONS = {
  editorial:['hero','eyebrow','headline','sub','p1','highlight','buttons'],
  classic:['hero','headline','sub','p1','sp01','stats','pair','p2','wide','p3','sp23','closing','buttons'],
  short:['hero','eyebrow','headline','sub','stats','p1','buttons'],
  offer:['offer','hero','headline','sub','stats','p1','buttons'],
  brief:['brief','headline','sub','stats','p1','bullets','hero','buttons'],
  curiosity:['eyebrow','headline','hero','p1','bullets','buttons']
};
const SECTION_LABELS = {highlight:'Highlight line',hero:'Main image',eyebrow:'Eyebrow',headline:'Headline',sub:'Subheadline',p1:'Paragraph 1',sp01:'Selling points 1–2',stats:'Stat row',pair:'Image pair',p2:'Paragraph 2',wide:'Wide image',p3:'Amenities',sp23:'Selling points 3–4',closing:'Ending headline',buttons:'Buttons',offer:'Offer band',bullets:'List',brief:'Brief header'};
function secLabel(k,layout){return (layout==='brief'&&k==='stats')?'Key figures':SECTION_LABELS[k]||k}
const BLOCK_TYPES = {eyebrow:'Small label',heading:'Heading',paragraph:'Paragraph',text:'Small text',callout:'Highlight box',pair:'Box pair',list:'Bullet list',rows:'Price rows',plan:'Payment plan rows',button:'Button',buttons:'Main buttons again',image:'Image',divider:'Divider',spacer:'Spacer',break:'Section break'};
/* Brochure starter: the section structure of the brochure template, with sample text to overwrite */
function edStarter(){
  const B=(type,en,x)=>Object.assign({type,pos:'auto',en:en||{},ar:{}},x||{});
  return [
    B('button',{label:'Register for priority access'},{pos:'after:highlight',link:'main',style:'dark'}),
    B('image',{},{shape:'full'}),
    B('eyebrow',{text:'Villas'}),
    B('heading',{text:'4 & 5-bedroom villas'}),
    B('paragraph',{text:'One or two lines on what makes this home type worth asking about.'},{readMore:false}),
    B('rows',{text:'4-bedroom villa · plot size | From AED X.XM\n5-bedroom villa · plot size | From AED X.XM'}),
    B('button',{label:'Get villa prices'},{link:'whatsapp',style:'dark'}),
    B('break',{},{bg:'white'}),
    B('image',{},{shape:'full'}),
    B('eyebrow',{text:'Townhouses'}),
    B('heading',{text:'3 & 4-bedroom townhouses'}),
    B('paragraph',{text:'One or two lines on the townhouses.'},{readMore:false}),
    B('rows',{text:'3-bedroom · size | From AED X.XM\n4-bedroom · size | From AED X.XM'}),
    B('button',{label:'Get floor plans'},{link:'whatsapp',style:'dark'}),
    B('break',{},{bg:'blue'}),
    B('image',{},{shape:'full'}),
    B('eyebrow',{text:'Amenities'}),
    B('heading',{text:'Everything within the community'}),
    B('paragraph',{text:'A short line on the lifestyle and amenities.'},{readMore:false}),
    B('pair',{a:'Central park / Trails and play areas',b:'Two lifestyle clubs / Pools, courts and gym'},{style:'sp'}),
    B('list',{title:'The park',text:'Landscaped walking paths\nPlay parks\nNature centre'}),
    B('break',{},{bg:'white'}),
    B('image',{},{shape:'full'}),
    B('eyebrow',{text:'Why now'}),
    B('heading',{text:'What the neighbouring communities did'}),
    B('list',{title:'Appreciation potential',text:'A sourced price-growth fact for a nearby community*\nA second sourced fact\nPlot size or density compared with similar areas'}),
    B('pair',{a:'Past growth nearby*',b:'Larger plots, similar price per sq ft'},{style:'callout'}),
    B('button',{label:'Ask about the launch'},{link:'whatsapp',style:'dark'}),
    B('break',{},{bg:'blue'}),
    B('plan',{title:'Payment plan',text:'10% | On booking | Down payment\n50% | During construction | Instalments\n40% | On handover | Handover date'}),
    B('break',{},{bg:'white'}),
    B('image',{},{shape:'full'}),
    B('eyebrow',{text:'Location'}),
    B('heading',{text:'Minutes from the main roads'}),
    B('paragraph',{text:'Where it sits and what is nearby.'},{readMore:false}),
    B('rows',{text:'14 min | Landmark one\n20 min | Landmark two\n25 min | Landmark three'}),
    B('button',{label:'View the location map'},{link:'landing',style:'dark'}),
    B('break',{},{bg:'blue'}),
    B('eyebrow',{text:'Launching soon'}),
    B('heading',{text:'Closing headline'}),
    B('paragraph',{text:'A last line on why to register now.'},{readMore:false})
  ];
}
function templateBlocks(t){return Array.isArray(t.blocks)?t.blocks:(t.extraImages||[]).map(im=>Object.assign({type:'image'},im||{}))}
const TXT = {
  en:{readMore:'Read more...', offerLabel:'Launch offer', brief:'Private investment brief', onReq:'On request', cta2:'Chat on WhatsApp',
      bulletsBrief:'Why buyers are looking now', bulletsCur:'Shared on WhatsApp only',
      unsub:'Unsubscribe', prefs:'Manage preferences', priv:'Privacy policy', why:"You're receiving this email because you subscribed to UAE property updates."},
  ar:{readMore:'اقرأ المزيد...', offerLabel:'عرض الإطلاق', brief:'موجز استثماري خاص', onReq:'عند الطلب', cta2:'تواصل عبر واتساب',
      bulletsBrief:'لماذا يتجه المشترون إليه الآن', bulletsCur:'نشاركها عبر واتساب فقط',
      unsub:'إلغاء الاشتراك', prefs:'تعديل التفضيلات', priv:'سياسة الخصوصية', why:'وصلتك هذه الرسالة لأنك مشترك في قائمتنا البريدية لتحديثات العقارات في الإمارات.'}
};
const DEFAULT_WA = 'https://wa.me/{number}?text={message}%20(Ref%20-%20{code}%20{acct})&utm_source={source}&utm_medium=email&utm_campaign={code}';
function waMessage(p,t,lang){
  const ar=lang==='ar';
  const own=ar?(t.waTextAr||''):(t.waTextEn||'');
  const proj=ar?(p.waTextAr||p.waTextEn||''):(p.waTextEn||'');
  return own||proj||('Please send me more details about '+(p.name||'this project'));
}
const DEFAULT_LANDING = 'https://{domain}/{path}?utm_source={source}&utm_medium=email&utm_campaign={code}&utm_content={acct}';
const ACCOUNT_DEFAULTS = JSON.parse(JSON.stringify(ACCOUNTS));
function applyAccountSettings(s){
  Object.keys(ACCOUNT_DEFAULTS).forEach(k=>{ACCOUNTS[k]=Object.assign({},ACCOUNT_DEFAULTS[k],((s||{}).accounts||{})[k]||{})});
}
const IMG_HOSTS = {Mailchimp:/(mcusercontent\.com|list-manage\.com|mailchimp)/i, GetResponse:/(gr-cdn\.com|getresponse)/i, MailerLite:/(mlcdn\.com|mailerlite)/i};
function imgUrlFor(im,acct){return ((im&&im.urls)||{})[acct]||(im&&im.url)||''}
function imgHostOk(url,acct){const plat=(ACCOUNTS[acct]||{}).platform;if(!url||!IMG_HOSTS[plat])return true;return IMG_HOSTS[plat].test(url)}

function emptyFields(t,lng){
  const c=t[lng]||{}, L=LAYOUTS[t.layout]||LAYOUTS.classic, out=[];
  L.fields.forEach(k=>{
    if(k==='stats'){if(!(c.stats||[]).some(s=>s&&s.v))out.push('stats')}

}

  const spec='Field formats: headline (max 70 chars), sub (max 80), eyebrow (max 32, uppercase-style label), p1/p2/p3 (2-3 sentences, no "Read more"), p3 may instead be an amenities list: a heading line then lines starting with "- ", offer (max 60, the launch offer line), offerNote (max 90), closing (ending headline, max 60), cta (button, max 22 chars), stats (array of 3 {"v": short value up to 9 chars, "l": short label}), sp01 (array of 2 selling points, each "first line / second line", each line max 24 chars), sp23 (same as sp01, two different points), bullets (array of 3 short lines, max 70 chars each).';

      Object.entries(o).forEach(([k,v])=>{

}

  ['whatsappNumber','WhatsApp number with country code','tel','971543738134'],
  ['waTextEn','WhatsApp message, English (the ref is added after it)','text','Please send me more details about Yas Riva Reserve'],
  ['waTextAr','WhatsApp message, Arabic (for Arabic emails)','text','يرجى إرسال المزيد من التفاصيل عن ياس ريفا ريزيرف'],
  ['waPattern','WhatsApp link pattern (advanced)','text',DEFAULT_WA],
  ['waPatternAr','WhatsApp link pattern for Arabic emails (optional)','text','Leave empty to use the one above'],
  ['cta2En','WhatsApp button label, English','text','Chat on WhatsApp'],['cta2Ar','WhatsApp button label, Arabic','text','تواصل عبر واتساب'],
  ['privacyUrl','Privacy policy URL','url','https://…'],['grCompany','GetResponse footer: company name','text',''],['grAddress','GetResponse footer: company address','text','']];
function renderProjSel(){const ids=Object.keys(projects);$('#projSel').innerHTML=ids.length?ids.map(id=>'<option value="'+esc(id)+'">'+esc(projects[id].name||id)+'</option>').join(''):'<option>No projects yet</option>';if(projId)$('#projSel').value=projId}
$('#projSel').onchange=e=>{projId=e.target.value;selId=null;draft=null;renderList();renderEditor();renderPreview()};
$('#projBtn').onclick=()=>{
  const p=proj();
  const val=k=>k==='cta2En'?((p.cta2||{}).en||''):k==='cta2Ar'?((p.cta2||{}).ar||''):(p[k]||'');
  const lu=p.landingUrls||{}, t0=Object.assign({},draft||{},{useLanding:true});
  const pre=a=>Object.prototype.hasOwnProperty.call(lu,a)?cleanLandingBase(lu[a]):(landingUrl(Object.assign({},p,{landingUrls:{}}),t0,a)||'').split('?')[0];
  $('#projForm').innerHTML='<div class="sec" style="border-top:0;padding-top:0">Landing pages</div>'+
    '<div class="hint">Paste each account\'s landing page when it\'s ready. A full link with utm tags is fine: the bank keeps the page address and adds the right utm tags for every email. If a pasted link carries a different utm_source from the account default, this project keeps the pasted utm_source for that account. Leave an account empty if it has no landing page; its links go to WhatsApp.</div>'+
    '<div class="f"><label for="p-landingPath">Quick fill: same path on every account\'s domain</label><div style="display:flex;gap:6px"><input type="text" id="p-landingPath" data-k="landingPath" value="'+esc(p.landingPath||'')+'" placeholder="masaar-3" class="mono" style="font-size:12.5px"><button type="button" class="btn small" id="fillLanding">Fill</button></div></div>'+
    Object.entries(ACCOUNTS).map(([a,ac])=>'<div class="f"><label for="lu-'+a+'"><span><b class="mono">'+a+'</b> · '+esc(ac.platform)+'</span><button type="button" class="btn small" data-luclear="'+a+'" style="padding:1px 8px">No landing page</button></label><input type="url" id="lu-'+a+'" data-lu="'+a+'" value="'+esc(pre(a))+'" placeholder="No landing page: links go to WhatsApp" class="mono" style="font-size:12.5px"><div class="link-out" data-luout="'+a+'" style="margin-top:4px"></div></div>').join('')+
    '<div class="sec">WhatsApp</div><div class="f"><label>WhatsApp link this makes (GR1, English)</label><div class="link-out" id="waPreview"></div></div>'+PFIELDS.map(([k,l,t,ph])=>'<div class="f"'+(k==='cta2Ar'||k==='waTextAr'?' dir="rtl"':'')+'><label for="p-'+k+'">'+l+'</label><input type="'+t+'" id="p-'+k+'" data-k="'+k+'" value="'+esc(val(k))+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(/Pattern/.test(k)?' class="mono" style="font-size:12px"':'')+'></div>').join('')+
    '<div class="hint">Patterns fill these in per email: {message} the WhatsApp message above, {code} campaign code, {acct} account code (GR1), {source} account UTM source (GR-eliteresidences), {domain} account landing domain, {path} landing path, {number} WhatsApp number, {project} project code, {name} project name, {date} send date as YYMMDD, {layout} layout name. Paste your link with %20 for spaces, as it is in your platform.</div>';
  updWaPreview();
  $('#projDlg').showModal();
};
function readProjForm(){const body=Object.assign({},proj());document.querySelectorAll('#projForm [data-k]').forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(k==='cta2En'||k==='cta2Ar'){body.cta2=Object.assign({},body.cta2||{},{[k==='cta2En'?'en':'ar']:v})}else body[k]=v});
  const lus=document.querySelectorAll('#projForm [data-lu]');if(lus.length){body.landingUrls={};const ls=Object.assign({},body.landingSources||{});lus.forEach(i=>{const a=i.dataset.lu,raw=i.value.trim();body.landingUrls[a]=cleanLandingBase(raw);const m=raw.match(/[?&]utm_source=([^&#]+)/i);if(!raw)delete ls[a];else if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}if(v===(ACCOUNTS[a]||{}).source)delete ls[a];else ls[a]=v}});body.landingSources=ls}
  return body}
function updWaPreview(){const el=$('#waPreview');if(!el)return;const p=readProjForm();const t=Object.assign({},draft||{},{waTextEn:'',waTextAr:''});const u=waUrl(p,t,'GR1','en');let shown=u;try{shown=decodeURIComponent(u)}catch(e){}el.textContent=u?shown:'Add a WhatsApp number to build the link.';
  const tl=Object.assign({},t,{useLanding:true});
  document.querySelectorAll('#projForm [data-luout]').forEach(o=>{const l=landingUrl(p,tl,o.dataset.luout);o.innerHTML=l?esc(l):'<span class="muted">No landing page, links go to WhatsApp</span>'})}
const AFIELDS=[['domain','Landing domain','projects.example.com'],['source','utm_source','GR-example']];
$('#acctBtn').onclick=()=>{
  $('#acctForm').innerHTML='<div class="hint">Each account sends from its own landing domain. Change a domain here and every project and template uses it. Untick "Has landing pages" for an account that should send WhatsApp links only.</div>'+
    Object.entries(ACCOUNTS).map(([k,a])=>'<div class="acct"><div class="h"><b>'+k+'</b><span class="muted" style="font-size:12px">'+a.platform+'</span></div>'+
      AFIELDS.map(([f,l,ph])=>'<div class="f"><label for="a-'+k+'-'+f+'">'+l+'</label><input type="text" id="a-'+k+'-'+f+'" data-a="'+k+'" data-f="'+f+'" value="'+esc(a[f]||'')+'" placeholder="'+ph+'" class="mono" style="font-size:12.5px"></div>').join('')+
      '<div class="toggles"><label><input type="checkbox" data-a="'+k+'" data-f="landing"'+(a.landing!==false?' checked':'')+'> Has landing pages</label></div></div>').join('');
  $('#acctDlg').showModal();
};
$('#acctCancel').onclick=()=>$('#acctDlg').close();
$('#acctSave').onclick=async()=>{
  if(!db)return;const accounts={};
  document.querySelectorAll('#acctForm [data-a]').forEach(i=>{const k=i.dataset.a,f=i.dataset.f;accounts[k]=accounts[k]||{};accounts[k][f]=i.type==='checkbox'?i.checked:i.value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'')});
  try{await db.doc('settings/accounts').set({accounts});$('#acctDlg').close();toast('Accounts saved')}catch(e){toast('Could not save accounts.')}
};
$('#projForm').addEventListener('input',updWaPreview);
$('#projForm').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.luclear){const i=$('#lu-'+b.dataset.luclear);if(i){i.value='';updWaPreview()}return}
  if(b.id==='fillLanding'){const path=($('#p-landingPath').value||'').trim().replace(/^\/+/,'');if(!path){toast('Type the path first, e.g. masaar-3');return}
    let n=0;Object.entries(ACCOUNTS).forEach(([a,ac])=>{const i=$('#lu-'+a);if(!i||ac.landing===false||!ac.domain)return;i.value='https://'+ac.domain+'/'+path;n++});
    updWaPreview();toast('Filled '+n+' account'+(n===1?'':'s')+'. Clear any that have no page yet.')}
});
$('#projForm').addEventListener('paste',e=>{const i=e.target;if(!i.dataset||!i.dataset.lu)return;setTimeout(()=>{i.value=cleanLandingBase(i.value);updWaPreview()},0)});
$('#projCancel').onclick=()=>$('#projDlg').close();
$('#projSave').onclick=async()=>{
  if(!db||!projId)return;const body=readProjForm();
  if(body.code&&!/^P\d{4}$/.test(body.code)){toast('Project code must be P plus 4 digits, e.g. P1004');return}
  try{await db.doc('projects/'+projId).set(body);$('#projDlg').close();toast('Settings saved')}catch(e){toast('Could not save settings.')}
};

/* ---------- boot ---------- */
(async()=>{
  if(!window.claude||!claude.use){$('#conn').textContent='Could not start. Reload the page.';$('#list').innerHTML='<div class="empty">Templates load when this page is opened in Claude.</div>';return}
  const timer=setTimeout(()=>{$('#conn').textContent='Still connecting. Templates may be out of date.'},10000);
  db=await claude.use('db');
  if(!db){clearTimeout(timer);$('#conn').textContent='Sign in to load templates.';$('#list').innerHTML='<div class="empty">Sign in to Claude to see the template bank.</div>';return}
  claude.use('user').then(async u=>{if(u){try{uid=await u.id()}catch(e){}}});
  claude.use('assets').then(a=>{assets=a;if(tab==='images')renderEditor()});
  claude.use('downloads').then(d=>{downloads=d});
  claude.use('sample').then(s=>{sample=s;if(draft)renderEditor()});
  db.doc('settings/accounts').onSnapshot(d=>{applyAccountSettings(d.exists?d.data():null);if(draft){schedulePreview();if(tab==='send')renderEditor()}},()=>{});
  db.collection('projects').onSnapshot(s=>{projects={};s.docs.forEach(d=>projects[d.id]=d.data());if(!projId||!projects[projId])projId=Object.keys(projects)[0]||null;renderProjSel();renderList();if(draft)schedulePreview()},()=>{});
  db.collection('templates').onSnapshot(s=>{
    if(!s.metadata.fromCache){clearTimeout(timer);$('#conn').textContent='Connected to your database.'}
    templates=s.docs.map(d=>({id:d.id,data:d.data()}));
    const c=cur();
    if(c&&!dirty){const before=JSON.stringify(draft);draft=migrateDraft(clone(c.data));if(JSON.stringify(draft)!==before){renderEditor();schedulePreview()}}
    else if(c&&dirty&&c.data.updatedAt&&c.data.updatedAt!==draft.updatedAt&&c.data.updatedBy!==uid){remoteChanged=true;renderEditor()}
    if(!selId){const first=templates.filter(t=>t.data.project===projId&&t.data.status!=='Archived').sort((a,b)=>(a.data.sendDate||'9').localeCompare(b.data.sendDate||'9'))[0];if(first){select(first.id);return}}
    renderList();
  },e=>{clearTimeout(timer);$('#conn').textContent='Could not load templates ('+(e&&e.code||'error')+').'});
})();
</script>

</body>
</html>
